
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/json;

    sendfile        on;
    
    keepalive_timeout  65;

    server {
        listen       8080;
        server_name  localhost;
        # 指定前端项目所在的位置
        location / {
            root   html/hmdp;
            index  index.html index.htm;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }


        location /api {  
            default_type  application/json;
            #internal;  
            keepalive_timeout   30s;  
            keepalive_requests  1000;  
            #支持keep-alive  
            proxy_http_version 1.1;  
            rewrite /api(/.*) $1 break;  
            proxy_pass_request_headers on;
            #more_clear_input_headers Accept-Encoding;  
            proxy_next_upstream error timeout;  
            proxy_pass http://127.0.0.1:8081;
            #proxy_pass http://backend;
        }

        # 前端页面（index/login/shop-detail/order...）直接调用根路径 API，
        # 统一反代到 local-perks 8081，避免每个页面都改 baseURL。
        location ~ ^/(shop|shop-type|voucher|voucher-order|blog|blog-comments|user|upload|follow)(/|$) {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_pass_request_headers on;
            proxy_next_upstream error timeout;
            proxy_read_timeout 30s;
            proxy_pass http://127.0.0.1:8081;
        }

        # 智能客服（EchoMind）反向代理
        location /cs-api {
            keepalive_timeout   30s;
            keepalive_requests  1000;
            proxy_http_version 1.1;
            # SSE 必须关缓冲，否则 delta 会被攒成一坨再吐给浏览器
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            proxy_set_header X-Accel-Buffering no;
            chunked_transfer_encoding on;
            rewrite /cs-api(/.*) $1 break;
            proxy_pass_request_headers on;
            proxy_next_upstream error timeout;
            # 略大于后端 stream-timeout(180s)；期间有心跳，不会空闲断开
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_pass http://127.0.0.1:18080;
        }
    }

    upstream backend {
        server 127.0.0.1:8081 max_fails=5 fail_timeout=10s weight=1;
        #server 127.0.0.1:8082 max_fails=5 fail_timeout=10s weight=1;
    }  
}
