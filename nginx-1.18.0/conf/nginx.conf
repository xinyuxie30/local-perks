
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/json;

    sendfile        on;
    # 攒够一个 MSS 再发，配合 sendfile 减少小包
    tcp_nopush      on;
    tcp_nodelay     on;

    keepalive_timeout  65;

    # ---------------- 传输优化 ----------------
    # element.js / vue.js / element.css 都是几百 KB，压缩后能省 70% 左右
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/javascript application/x-javascript
                      application/json application/xml image/svg+xml;
    gzip_disable      "msie6";

    # 上传探店图片可能超过默认 1m，否则 413
    client_max_body_size 10m;
    client_body_timeout  20s;
    client_header_timeout 20s;

    # 静态文件元信息缓存，减少 open/stat 系统调用
    open_file_cache           max=2000 inactive=60s;
    open_file_cache_valid     120s;
    open_file_cache_min_uses  2;
    open_file_cache_errors    on;

    server {
        listen       8080;
        server_name  localhost;

        # 前端项目根目录（下面的 location 都继承它）
        root   html/hmdp;

        add_header X-Content-Type-Options nosniff always;

        location / {
            index  index.html index.htm;
            # 页面本身不缓存，改完刷新就能看到
            add_header Cache-Control "no-cache";
        }

        # ---- 静态资源缓存 ----
        # 图片/字体带内容指纹（或很少变），长缓存
        location ~* \.(?:png|jpe?g|gif|ico|webp|bmp|svg|woff2?|ttf|eot)$ {
            expires 30d;
            access_log off;
        }

        # 第三方库和业务脚本：7 天，改版时靠改文件名/手动刷新
        location ~* \.(?:css|js)$ {
            expires 7d;
        }

        location ~* \.html$ {
            add_header Cache-Control "no-cache";
        }

        # 本地上游连接失败仍返回正确的 5xx 和 JSON，不能落到不存在的静态页变成 404。
        error_page 500 502 503 504 =503 @backend_unavailable;
        location @backend_unavailable {
            default_type application/json;
            return 503 '{"success":false,"errorMsg":"服务暂时不可用，请稍后重试"}';
        }

        # 兼容旧的 /api 前缀（axios baseURL）
        location /api {
            default_type  application/json;
            keepalive_timeout   30s;
            keepalive_requests  1000;
            #支持keep-alive
            proxy_http_version 1.1;
            rewrite /api(/.*) $1 break;
            proxy_pass_request_headers on;
            # 限流按 IP 维度统计，必须把真实客户端地址透传给后端
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_next_upstream error timeout;
            proxy_read_timeout 30s;
            proxy_set_header Connection "";
            proxy_pass http://backend;
        }

        # 前端页面（index/login/shop-detail/order...）直接调用根路径 API，
        # 统一反代到 local-perks 8081，避免每个页面都改 baseURL。
        location ~ ^/(shop|shop-type|voucher|voucher-order|blog|blog-comments|user|upload|follow)(/|$) {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_request_headers on;
            proxy_next_upstream error timeout;
            proxy_read_timeout 30s;
            proxy_set_header Connection "";
            proxy_pass http://backend;
        }

        # 智能客服（EchoMind）反向代理
        location /cs-api {
            keepalive_timeout   30s;
            keepalive_requests  1000;
            proxy_http_version 1.1;
            # SSE 必须关缓冲，否则 delta 会被攒成一坨再吐给浏览器
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            proxy_set_header X-Accel-Buffering no;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            chunked_transfer_encoding on;
            rewrite /cs-api(/.*) $1 break;
            proxy_pass_request_headers on;
            proxy_next_upstream error timeout;
            # 略大于后端 stream-timeout(180s)；期间有心跳，不会空闲断开
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_pass http://127.0.0.1:18080;
        }
    }

    upstream backend {
        keepalive 512;
        keepalive_requests 10000;
        keepalive_timeout 60s;
        server 127.0.0.1:8081 max_fails=5 fail_timeout=10s weight=1;
        #server 127.0.0.1:8082 max_fails=5 fail_timeout=10s weight=1;
    }
}
