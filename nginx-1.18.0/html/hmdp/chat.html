<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
<title>智能助手 · 智惠生活通</title>
<style>
  :root {
    --brand: #ff6a3d;
    --brand-2: #ff9166;
    --brand-soft: #fff3ee;
    --ink: #1d2129;
    --ink-2: #4e5969;
    --muted: #86909c;
    --line: #edeff3;
    --bg: #f7f8fa;
    --card: #ffffff;
    --ok: #22c55e;
    --warn: #f59e0b;
    --danger: #ef4444;
    --radius: 16px;
    --shadow-sm: 0 1px 2px rgba(16, 24, 40, .04), 0 1px 3px rgba(16, 24, 40, .06);
    --shadow-md: 0 8px 24px rgba(16, 24, 40, .08);
    --shadow-lg: 0 24px 60px rgba(16, 24, 40, .14);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 600px at 10% -10%, #fff1ea 0%, transparent 55%),
      radial-gradient(900px 500px at 110% 0%, #eef4ff 0%, transparent 50%),
      var(--bg);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }

  .app { display: flex; height: 100vh; }

  /* ---------- 左侧图标栏 ---------- */
  .rail {
    width: 68px; flex: 0 0 68px; display: flex; flex-direction: column; align-items: center;
    padding: 16px 0 14px; gap: 6px; background: rgba(255,255,255,.72);
    border-right: 1px solid var(--line); backdrop-filter: blur(12px); z-index: 20;
  }
  .rail-brand {
    width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center;
    background: linear-gradient(145deg, var(--brand-2), var(--brand)); color: #fff;
    font-weight: 700; font-size: 13px; letter-spacing: .5px;
    box-shadow: 0 6px 16px rgba(255, 106, 61, .32);
  }
  .rail-sep { width: 26px; height: 1px; background: var(--line); margin: 8px 0; }
  .rail-btn {
    width: 42px; height: 42px; border-radius: 13px; border: 1px solid transparent;
    background: transparent; color: var(--ink-2); font-size: 17px;
    display: grid; place-items: center; transition: all .18s ease;
  }
  .rail-btn:hover { background: var(--brand-soft); color: var(--brand); border-color: #ffe2d6; }
  .rail-btn.accent { background: #fff; border-color: var(--line); box-shadow: var(--shadow-sm); }
  .rail-spacer { flex: 1; }
  .rail-tip {
    position: absolute; left: 72px; background: #1d2129; color: #fff; font-size: 12px;
    padding: 5px 9px; border-radius: 8px; white-space: nowrap; opacity: 0; pointer-events: none;
    transform: translateX(-4px); transition: all .16s ease;
  }
  .rail-btn:hover .rail-tip { opacity: 1; transform: translateX(0); }

  /* ---------- 主区 ---------- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }

  .topbar {
    height: 64px; flex: 0 0 64px; display: flex; align-items: center; gap: 12px;
    padding: 0 22px; border-bottom: 1px solid rgba(237,239,243,.9); background: rgba(255,255,255,.66);
    backdrop-filter: blur(12px); z-index: 10;
  }
  .tb-title { font-size: 15px; font-weight: 650; letter-spacing: .2px; }
  .tb-status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-top: 3px; }
  .tb-status i { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px rgba(34,197,94,.14); }
  .tb-status.busy i { background: var(--warn); box-shadow: 0 0 0 3px rgba(245,158,11,.16); animation: pulse 1.2s infinite; }
  .tb-status.off i { background: #c9ced6; box-shadow: none; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
  .tb-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .chip-btn {
    height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line);
    background: #fff; color: var(--ink-2); font-size: 13px; transition: all .18s ease;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .chip-btn svg { width: 14px; height: 14px; opacity: .78; }
  .chip-btn:hover { border-color: #ffd8c9; color: var(--brand); background: #fffaf7; }
  .chip-btn:hover svg { opacity: 1; }
  .user-chip {
    display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px 0 4px;
    border-radius: 999px; border: 1px solid var(--line); background: #fff; color: var(--ink-2);
    font-size: 12.5px; text-decoration: none; transition: all .16s ease; max-width: 168px;
  }
  .user-chip:hover { border-color: #ffd8c9; background: #fffaf7; color: var(--brand); }
  .user-chip .ua {
    width: 26px; height: 26px; border-radius: 50%; flex: 0 0 26px; overflow: hidden;
    background: linear-gradient(135deg, #ffe3d6, #ffd0bb); color: #c2410c;
    font-size: 12px; font-weight: 600; display: grid; place-items: center;
  }
  .user-chip .ua img { width: 100%; height: 100%; object-fit: cover; }
  .user-chip .un { max-width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .primary-btn {
    height: 34px; padding: 0 15px; border-radius: 10px; border: none; color: #fff; font-size: 13px;
    background: linear-gradient(135deg, var(--brand-2), var(--brand));
    box-shadow: 0 4px 12px rgba(255,106,61,.26); transition: all .18s ease;
  }
  .primary-btn:hover { transform: translateY(-1px); box-shadow: 0 7px 18px rgba(255,106,61,.34); }

  /* ---------- 对话区 ---------- */
  .chat { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
  .chat-inner { max-width: 860px; margin: 0 auto; padding: 34px 24px 28px; min-height: 100%; display: flex; flex-direction: column; }
  .chat-inner.empty { justify-content: center; padding-bottom: 60px; }

  .hero { text-align: center; padding: 0 0 8px; animation: rise .5s ease both; }
  .hero-orb {
    width: 58px; height: 58px; border-radius: 20px; margin: 0 auto 18px; display: grid; place-items: center;
    background: linear-gradient(145deg, #fff, #fff5f0); border: 1px solid #ffe6db;
    color: var(--brand); font-weight: 700; font-size: 18px; box-shadow: var(--shadow-md);
  }
  .hero h1 { font-size: 25px; font-weight: 680; letter-spacing: -.3px; }
  .hero p { font-size: 13.5px; color: var(--muted); margin-top: 10px; line-height: 1.7; }
  .hero-cards {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;
    margin: 28px auto 0; max-width: 640px; text-align: left;
  }
  .hero-card {
    display: flex; gap: 11px; align-items: flex-start; padding: 14px 15px; background: #fff;
    border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-sm);
    transition: all .18s ease; text-align: left;
  }
  .hero-card:hover { border-color: #ffd8c9; box-shadow: 0 10px 26px rgba(255,106,61,.12); transform: translateY(-2px); }
  .hero-card .ico { font-size: 17px; line-height: 1.2; }
  .hero-card b { display: block; font-size: 13.5px; font-weight: 620; }
  .hero-card span { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.5; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }

  .msg { display: flex; gap: 12px; margin-bottom: 26px; animation: rise .28s ease both; }
  .msg.user { justify-content: flex-end; }
  .avatar {
    width: 30px; height: 30px; flex: 0 0 30px; border-radius: 10px; display: grid; place-items: center;
    font-size: 11px; font-weight: 700; margin-top: 2px;
  }
  .avatar.bot { background: linear-gradient(145deg, #fff2ec, #ffe3d6); color: var(--brand); border: 1px solid #ffdccd; }
  .msg .body { min-width: 0; max-width: 100%; flex: 1; }
  .msg.user .body { flex: 0 1 auto; max-width: 76%; }

  .bubble {
    font-size: 14.5px; line-height: 1.78; color: var(--ink);
    padding: 13px 16px; border-radius: 14px; background: #fff; border: 1px solid var(--line);
    box-shadow: var(--shadow-sm); word-break: break-word;
  }
  .msg.user .bubble {
    background: linear-gradient(135deg, var(--brand-2), var(--brand)); color: #fff; border: none;
    border-bottom-right-radius: 5px; box-shadow: 0 6px 18px rgba(255,106,61,.24);
  }
  .msg.bot .bubble { border-bottom-left-radius: 5px; }

  /* markdown */
  .bubble p { margin: 0 0 9px; }
  .bubble > *:last-child { margin-bottom: 0; }
  .bubble h1, .bubble h2, .bubble h3 { font-size: 15px; font-weight: 650; margin: 14px 0 8px; }
  .bubble h1:first-child, .bubble h2:first-child, .bubble h3:first-child { margin-top: 0; }
  .bubble ul, .bubble ol { margin: 6px 0 10px; padding-left: 20px; }
  .bubble li { margin: 3px 0; }
  .bubble code {
    background: #f2f4f7; border: 1px solid #e9edf2; border-radius: 5px;
    padding: 1px 5px; font-size: 12.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .bubble pre {
    background: #1e2430; color: #e6edf3; border-radius: 10px; padding: 12px 14px; overflow-x: auto;
    margin: 10px 0; font-size: 12.5px; line-height: 1.6;
  }
  .bubble pre code { background: none; border: none; color: inherit; padding: 0; }
  .bubble table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 13px; }
  .bubble th, .bubble td { border: 1px solid #eef0f4; padding: 7px 10px; text-align: left; }
  .bubble th { background: #fafbfc; font-weight: 600; color: var(--ink-2); }
  .bubble blockquote { border-left: 3px solid #ffd9c9; padding-left: 12px; color: var(--ink-2); margin: 8px 0; }
  .bubble a { color: var(--brand); text-decoration: underline; text-underline-offset: 2px; }
  .bubble hr { border: none; border-top: 1px solid var(--line); margin: 14px 0; }

  .caret {
    display: inline-block; width: 3px; height: 15px; background: var(--brand); border-radius: 2px;
    vertical-align: -2px; margin-left: 2px; animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: 0 } }

  .thinking { display: inline-flex; gap: 5px; align-items: center; padding: 3px 0; }
  .thinking i { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); opacity: .3; animation: dot 1.3s infinite; }
  .thinking i:nth-child(2) { animation-delay: .18s; }
  .thinking i:nth-child(3) { animation-delay: .36s; }
  @keyframes dot { 0%,70%,100% { opacity: .25; transform: translateY(0) } 35% { opacity: 1; transform: translateY(-3px) } }

  /* 执行过程（默认折叠，不干扰阅读） */
  .process { margin-bottom: 10px; border: 1px solid var(--line); border-radius: 12px; background: #fbfcfd; overflow: hidden; }
  .process-head {
    width: 100%; display: flex; align-items: center; gap: 9px; padding: 9px 12px;
    background: transparent; border: none; font-size: 12.5px; color: var(--ink-2); text-align: left;
    transition: background .16s ease;
  }
  .process-head:hover { background: #f4f6f9; }
  .process-head .ptext { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .process-head .chev { transition: transform .2s ease; color: #adb4bd; display: grid; place-items: center; flex: 0 0 12px; }
  .process.open .process-head .chev { transform: rotate(90deg); }
  .process-head .spin {
    width: 13px; height: 13px; border-radius: 50%; border: 2px solid #ffd9c9; border-top-color: var(--brand);
    animation: spin .8s linear infinite; flex: 0 0 13px;
  }
  .process.done .process-head .spin {
    border: none; width: 15px; height: 15px; background: #e8f8ee; color: var(--ok);
    display: grid; place-items: center; font-size: 9px; animation: none;
  }
  .process.done .process-head .spin::after { content: '✓'; }
  @keyframes spin { to { transform: rotate(360deg) } }
  .process-list { display: none; padding: 4px 12px 12px; }
  .process.open .process-list { display: block; }
  .step { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); padding: 5px 0; }
  .step .sdot { width: 6px; height: 6px; border-radius: 50%; background: #ffcbb6; flex: 0 0 6px; }
  .step.done .sdot { background: var(--ok); }
  .step.fail .sdot { background: var(--danger); }
  .step .sname {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11.5px; color: #7b838d; flex: 0 0 auto;
  }
  .step .sdesc { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
  .step .stime { color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; flex: 0 0 auto; }
  .sub-card { border: 1px solid var(--line); border-radius: 10px; background: #fff; padding: 9px 11px; margin: 6px 0; }
  .sub-card .sh { display: flex; align-items: center; gap: 7px; font-size: 12px; }
  .sub-card .sh b { font-weight: 620; }
  .sub-card .sh .tag { font-size: 10px; color: #8a6412; background: #fff8e8; border: 1px solid #ffe8bd; border-radius: 5px; padding: 1px 5px; }
  .sub-card .sh .st { margin-left: auto; color: var(--muted); font-size: 11px; }
  .sub-card .task { font-size: 11.5px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
  .sub-card .sum { font-size: 12px; color: var(--ink-2); margin-top: 7px; line-height: 1.6; white-space: pre-wrap; max-height: 108px; overflow: hidden; }

  .msg-foot { font-size: 11px; color: #a9afb8; margin-top: 7px; display: flex; gap: 8px; flex-wrap: wrap; }

  /* 审批卡片 */
  .approve-card {
    margin-top: 10px; border: 1px solid #ffe0b2; background: linear-gradient(180deg, #fffdf7, #fff8ec);
    border-radius: 14px; padding: 14px 15px; box-shadow: var(--shadow-sm);
  }
  .approve-card .ah { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 620; color: #8a5a00; }
  .approve-card .ad { font-size: 12.5px; color: #9a6b1a; margin-top: 7px; line-height: 1.6; }
  .approve-card .aa { display: flex; gap: 9px; margin-top: 12px; }
  .btn-ghost { height: 34px; padding: 0 16px; border-radius: 9px; border: 1px solid #ffd9c9; background: #fff; color: var(--ink-2); font-size: 13px; }
  .btn-ghost:hover { border-color: #ffb99f; color: var(--brand); }
  .btn-brand { height: 34px; padding: 0 18px; border-radius: 9px; border: none; background: linear-gradient(135deg, var(--brand-2), var(--brand)); color: #fff; font-size: 13px; box-shadow: 0 4px 12px rgba(255,106,61,.24); }
  .btn-brand:hover { filter: brightness(1.03); }

  .to-bottom {
    position: absolute; right: 26px; bottom: 132px; width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid var(--line); background: #fff; color: var(--ink-2); box-shadow: var(--shadow-md);
    display: none; place-items: center; font-size: 14px;
  }
  .to-bottom.show { display: grid; }

  /* ---------- 输入区 ---------- */
  .composer { padding: 6px 24px 22px; }
  .composer-inner {
    max-width: 860px; margin: 0 auto; display: flex; align-items: flex-end; gap: 10px;
    background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 9px 9px 9px 16px;
    box-shadow: 0 10px 30px rgba(16,24,40,.07); transition: border-color .18s ease, box-shadow .18s ease;
  }
  .composer-inner:focus-within { border-color: #ffcdb9; box-shadow: 0 12px 34px rgba(255,106,61,.13); }
  #csInput {
    flex: 1; border: none; outline: none; resize: none; font-size: 14.5px; line-height: 1.6;
    max-height: 160px; height: 26px; padding: 8px 0; background: transparent; color: var(--ink); font-family: inherit;
  }
  #csInput::placeholder { color: #b6bcc4; }
  .send-btn {
    width: 38px; height: 38px; flex: 0 0 38px; border-radius: 13px; border: none; color: #fff; font-size: 16px;
    background: linear-gradient(135deg, var(--brand-2), var(--brand)); box-shadow: 0 6px 16px rgba(255,106,61,.3);
    transition: all .18s ease; display: grid; place-items: center;
  }
  .send-btn:hover { transform: translateY(-1px); }
  .send-btn:disabled { background: #eef0f4; color: #b6bcc4; box-shadow: none; cursor: not-allowed; transform: none; }
  .send-btn.stop { background: linear-gradient(135deg, #8d96a3, #6b7280); box-shadow: 0 6px 16px rgba(107,114,128,.26); }
  .composer-hint {
    max-width: 860px; margin: 9px auto 0; display: flex; justify-content: space-between;
    font-size: 11.5px; color: #b0b6be; padding: 0 6px;
  }

  /* ---------- 右侧抽屉 ---------- */
  .drawer-mask {
    position: fixed; inset: 0; background: rgba(20, 24, 32, .28); opacity: 0; pointer-events: none;
    transition: opacity .22s ease; z-index: 40;
  }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: 424px; max-width: 92vw; background: #fff;
    box-shadow: var(--shadow-lg); transform: translateX(100%); transition: transform .26s cubic-bezier(.32,.72,.3,1);
    z-index: 50; display: flex; flex-direction: column;
  }
  .drawer.open { transform: none; }
  .app.drawer-open .drawer-mask { opacity: 1; pointer-events: auto; }
  .drawer-head { padding: 16px 16px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
  .segmented { display: flex; gap: 3px; background: #f2f4f7; border-radius: 11px; padding: 3px; flex: 1; }
  .segmented button {
    flex: 1; height: 30px; border: none; border-radius: 9px; background: transparent; color: var(--ink-2);
    font-size: 12.5px; transition: all .16s ease;
  }
  .segmented button.active { background: #fff; color: var(--brand); font-weight: 600; box-shadow: var(--shadow-sm); }
  .icon-x { width: 30px; height: 30px; border-radius: 9px; border: 1px solid var(--line); background: #fff; color: var(--muted); font-size: 12px; }
  .icon-x:hover { color: var(--ink); }
  .drawer-body { flex: 1; overflow-y: auto; padding: 16px; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; animation: fade .2s ease both; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px) } to { opacity: 1; transform: none } }

  .panel-title { font-size: 13px; font-weight: 620; margin: 4px 0 10px; display: flex; align-items: center; gap: 7px; }
  .panel-title .cnt { font-size: 11px; color: var(--muted); font-weight: 400; }
  .panel-desc { font-size: 12px; color: var(--muted); line-height: 1.65; margin-bottom: 12px; }

  .fn-row {
    display: flex; align-items: center; gap: 11px; padding: 11px 12px; border: 1px solid var(--line);
    border-radius: 12px; background: #fff; margin-bottom: 8px; transition: all .16s ease;
  }
  .fn-row:hover { border-color: #ffdccd; background: #fffdfb; }
  .fn-row .fi { width: 30px; height: 30px; border-radius: 9px; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; font-size: 14px; flex: 0 0 30px; }
  .fn-row .ft { min-width: 0; flex: 1; }
  .fn-row .ft b { font-size: 13px; font-weight: 600; display: block; }
  .fn-row .ft span { font-size: 11.5px; color: var(--muted); display: block; margin-top: 2px; }
  .fn-row .fa { display: flex; gap: 6px; }
  .mini-btn { height: 26px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: #fff; font-size: 11.5px; color: var(--ink-2); }
  .mini-btn:hover { border-color: #ffd9c9; color: var(--brand); }

  .agent-card { border: 1px solid var(--line); border-radius: 13px; padding: 13px; margin-bottom: 10px; background: #fff; }
  .agent-card.main { background: linear-gradient(180deg, #fffaf7, #fff); border-color: #ffe4d8; }
  .agent-card .ah { display: flex; align-items: center; gap: 8px; }
  .agent-card .ah b { font-size: 13.5px; font-weight: 630; }
  .agent-card .ah .badge { font-size: 10.5px; padding: 2px 7px; border-radius: 6px; background: var(--brand-soft); color: var(--brand); }
  .agent-card .ad { font-size: 12px; color: var(--muted); line-height: 1.6; margin-top: 6px; }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
  .tag { font-size: 11px; padding: 2px 7px; border-radius: 6px; background: #f5f7fa; color: #6b7280; }
  .tag.w { background: #fff1f0; color: #e5484d; }
  .tag.r { background: #f1f9f3; color: #2f9e44; }
  .more-link { font-size: 11.5px; color: var(--brand); margin-top: 8px; display: inline-block; }

  .mem-add {
    width: 100%; height: 36px; border-radius: 10px; border: 1px dashed #ffd2bf; background: #fffaf7;
    color: var(--brand); font-size: 12.5px; display: flex; align-items: center; justify-content: center;
    gap: 6px; margin-bottom: 14px; transition: all .16s ease;
  }
  .mem-add:hover { background: #fff4ee; border-color: #ffbea3; }
  .mem-add svg { width: 13px; height: 13px; }
  #panel-memory.editing .mem-add { display: none; }
  .mem-form { display: none; border: 1px solid var(--line); border-radius: 13px; padding: 12px; background: #fcfdfe; margin-bottom: 14px; }
  .mem-form.open { display: block; animation: fade .18s ease both; }
  .mem-form input, .mem-form textarea, .mem-form select {
    width: 100%; border: 1px solid #e8ebf0; border-radius: 9px; padding: 8px 10px; font-size: 12.5px;
    outline: none; font-family: inherit; background: #fff; color: var(--ink);
  }
  .mem-form input:focus, .mem-form textarea:focus { border-color: #ffcdb9; }
  .mem-form textarea { height: 72px; resize: vertical; margin-top: 8px; }
  .mem-form .row { display: flex; gap: 8px; margin-top: 8px; }
  .mem-form .row select { flex: 1; }
  .mem-form .row button { flex: 0 0 auto; }
  .mem-item { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 9px; background: #fff; }
  .mem-item .mh { display: flex; align-items: center; gap: 7px; }
  .mem-item .mt { font-size: 13px; font-weight: 620; }
  .mem-item .mtype { font-size: 10.5px; padding: 2px 6px; border-radius: 5px; background: #f2f5f9; color: #64748b; border: 1px solid transparent; }
  .mem-item .mtype.t-user { background: #eef5ff; color: #2563c9; border-color: #dbe8ff; }
  .mem-item .mtype.t-feedback { background: #edfaf4; color: #0f8a5f; border-color: #d2f0e3; }
  .mem-item .mtype.t-project { background: #f4f0ff; color: #6d47c9; border-color: #e6ddff; }
  .mem-item .mtype.t-reference { background: #f5f7f9; color: #5b6472; border-color: #e6eaef; }
  .mem-item .md { font-size: 12px; color: var(--ink-2); line-height: 1.65; margin-top: 7px; }
  .mem-item .mf { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 11px; color: var(--muted); }
  .mem-item .del { margin-left: auto; border: none; background: transparent; color: #b6bcc4; font-size: 11.5px; padding: 2px 4px; }
  .mem-item .del:hover { color: var(--danger); }

  .banner-sm {

            <button class="hero-card" data-ask="今天签到能拿什么？"><span class="ico">✓</span><span><b>签到与积分</b><span>连续签到天数与规则</span></span></button>

<script>
(function () {
  "use strict";

  var app = document.getElementById('app');
  var chatScroll = document.getElementById('chatScroll');
  var chatInner = document.getElementById('chatInner');
  var hero = document.getElementById('hero');
  var inputEl = document.getElementById('csInput');
  var sendEl = document.getElementById('csSend');
  var statusEl = document.getElementById('status');
  var statusText = document.getElementById('statusText');
  var charEl = document.getElementById('charCount');
  var toastEl = document.getElementById('toast');
  var toBottom = document.getElementById('toBottom');

  var state = {
    conversationId: 'c-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8),
    userId: 'anonymous',
    authToken: null,
    controller: null,
    busy: false,
    agentsLoaded: false,
    memoryLoaded: false,
    drawerTab: null,
    autoScroll: true
  };

  /* ================= 工具函数 ================= */
  function esc(t) {
    return String(t == null ? '' : t)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.className = 'toast show';
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { toastEl.className = 'toast'; }, 1900);
  }
  function readToken() {
    var t = null;
    try { t = sessionStorage.getItem('token'); } catch (e) {}
    if (!t) { try { t = localStorage.getItem('token'); } catch (e) {} }
    return t;
  }

  /* ================= Markdown 轻渲染 ================= */
  function inlineMd(s) {
    return s
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>')
      .replace(/~~([^~]+)~~/g, '<del>$1</del>')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }

  function md(text) {
    if (!text) { return ''; }
    var src = esc(text).replace(/\r\n/g, '\n');
    var lines = src.split('\n');
    var out = [];
    var i = 0;

    function isTableRow(l) { return /^\s*\|.*\|\s*$/.test(l); }
    function cells(l) {
      return l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(function (c) { return c.trim(); });
    }

    while (i < lines.length) {
      var line = lines[i];

      // 代码块
      if (/^\s*```/.test(line)) {
        var buf = [];
        i++;
        while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
        i++;
        out.push('<pre><code>' + buf.join('\n') + '</code></pre>');
        continue;
      }

      // 表格
      if (isTableRow(line) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
        var head = cells(line);
        i += 2;
        var body = [];
        while (i < lines.length && isTableRow(lines[i])) { body.push(cells(lines[i])); i++; }
        var html = '<table><thead><tr>' + head.map(function (h) { return '<th>' + inlineMd(h) + '</th>'; }).join('') + '</tr></thead><tbody>';
        body.forEach(function (row) {
          html += '<tr>' + row.map(function (c) { return '<td>' + inlineMd(c) + '</td>'; }).join('') + '</tr>';
        });
        out.push(html + '</tbody></table>');
        continue;
      }

      // 标题
      var h = line.match(/^\s*(#{1,4})\s+(.*)$/);
      if (h) {
        var lvl = Math.min(h[1].length + 1, 4);
        out.push('<h' + lvl + '>' + inlineMd(h[2]) + '</h' + lvl + '>');
        i++;
        continue;
      }

      // 分隔线
      if (/^\s*(---|\*\*\*|___)\s*$/.test(line)) { out.push('<hr>'); i++; continue; }

      // 引用
      if (/^\s*>\s?/.test(line)) {
        var q = [];
        while (i < lines.length && /^\s*>\s?/.test(lines[i])) { q.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
        out.push('<blockquote>' + inlineMd(q.join('<br>')) + '</blockquote>');
        continue;
      }

      // 列表
      if (/^\s*([-*+]|\d+\.)\s+/.test(line)) {
        var ordered = /^\s*\d+\./.test(line);
        var items = [];
        while (i < lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i])) {
          items.push(lines[i].replace(/^\s*([-*+]|\d+\.)\s+/, ''));
          i++;
        }
        var tag = ordered ? 'ol' : 'ul';
        out.push('<' + tag + '>' + items.map(function (t) { return '<li>' + inlineMd(t) + '</li>'; }).join('') + '</' + tag + '>');
        continue;
      }

      // 空行
      if (!line.trim()) { i++; continue; }

      // 段落（连续非空行合并）
      var p = [];
      while (i < lines.length && lines[i].trim() &&
             !/^\s*```/.test(lines[i]) && !/^\s*(#{1,4})\s+/.test(lines[i]) &&
             !/^\s*([-*+]|\d+\.)\s+/.test(lines[i]) && !isTableRow(lines[i]) &&
             !/^\s*>\s?/.test(lines[i]) && !/^\s*(---|\*\*\*|___)\s*$/.test(lines[i])) {
        p.push(lines[i]);
        i++;
      }
      out.push('<p>' + inlineMd(p.join('<br>')) + '</p>');
    }
    return out.join('');
  }

  /* ================= 滚动 ================= */
  function nearBottom() {
    return chatScroll.scrollHeight - chatScroll.scrollTop - chatScroll.clientHeight < 80;
  }
  function scrollBottom(force) {
    if (force || state.autoScroll) { chatScroll.scrollTop = chatScroll.scrollHeight; }
  }
  chatScroll.addEventListener('scroll', function () {
    state.autoScroll = nearBottom();
    toBottom.classList.toggle('show', !state.autoScroll);
  });
  toBottom.addEventListener('click', function () { state.autoScroll = true; scrollBottom(true); });

  /* ================= 消息渲染 ================= */
  function hideHero() {
    if (hero) { hero.style.display = 'none'; }
    chatInner.classList.remove('empty');
  }

  function addUserMsg(text) {
    var el = document.createElement('div');
    el.className = 'msg user';
    el.innerHTML = '<div class="body"><div class="bubble">' + md(text) + '</div></div>';
    chatInner.appendChild(el);
    scrollBottom(true);
  }

  function addBotMsg() {
    var el = document.createElement('div');
    el.className = 'msg bot';
    el.innerHTML =
      '<div class="avatar bot">AI</div>' +
      '<div class="body">' +
        '<div class="process" style="display:none">' +
          '<button class="process-head"><span class="spin"></span><span class="ptext">准备中…</span>' +
          '<span class="chev"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span></button>' +
          '<div class="process-list"></div>' +
        '</div>' +
        '<div class="bubble"><span class="thinking"><i></i><i></i><i></i></span></div>' +
        '<div class="msg-foot"></div>' +
      '</div>';
    chatInner.appendChild(el);
    var node = {
      el: el,
      process: el.querySelector('.process'),
      processHead: el.querySelector('.process-head'),
      processText: el.querySelector('.ptext'),
      processList: el.querySelector('.process-list'),
      bubble: el.querySelector('.bubble'),
      foot: el.querySelector('.msg-foot'),
      text: '',
      steps: 0,
      rounds: 0,
      subCount: 0,
      streaming: true,
      append: function (t) {
        if (this.text === '' && this.bubble.querySelector('.thinking')) { this.bubble.innerHTML = ''; }
        this.text += t;
        this.render();
      },
      setText: function (t) { this.text = t; this.render(); },
      render: function () {
        this.bubble.innerHTML = md(this.text) + (this.streaming ? '<span class="caret"></span>' : '');
        scrollBottom();
      },
      finish: function () {
        this.streaming = false;
        if (!this.text) { this.bubble.innerHTML = '<span style="color:#9aa1ab">（没有生成内容）</span>'; }
        else { this.bubble.innerHTML = md(this.text); }
        this.updateProcessHead(true);
        scrollBottom();
      },
      setStatus: function (t) {
        if (!this.text) {
          this.bubble.innerHTML = '<span class="thinking"><i></i><i></i><i></i></span>';
        }
        this.processText.textContent = t;
        scrollBottom();
      },
      addStep: function (name, summary) {
        this.steps++;
        var row = document.createElement('div');
        row.className = 'step';
        row.innerHTML = '<span class="sdot"></span>' +
          '<span class="sname">' + esc(name) + '</span>' +
          (summary ? '<span class="sdesc">' + esc(summary) + '</span>' : '') +
          '<span class="stime">执行中</span>';
        this.processList.appendChild(row);
        this.process.style.display = '';
        this.updateProcessHead(false);
        var self = this;
        return function (ok, ms) {
          row.className = 'step ' + (ok ? 'done' : 'fail');
          var t = row.querySelector('.stime');
          if (t) { t.textContent = ms != null ? ms + ' ms' : (ok ? '完成' : '失败'); }
          self.updateProcessHead(false);
        };
      },
      addSub: function (role, name, task) {
        this.subCount++;
        var card = document.createElement('div');
        card.className = 'sub-card';
        card.innerHTML = '<div class="sh"><b>' + esc(name || role) + '</b><span class="tag">专家</span>' +
          '<span class="st">处理中…</span></div>' +
          (task ? '<div class="task">' + esc(task) + '</div>' : '') + '<div class="sum"></div>';
        this.processList.appendChild(card);
        this.process.style.display = '';
        this.updateProcessHead(false);
        return card;
      },
      endSub: function (card, ok, ms, summary) {
        if (!card) { return; }
        var st = card.querySelector('.st');
        if (st) { st.textContent = (ok ? '完成' : '失败') + (ms != null ? ' · ' + (Math.round(ms / 100) / 10) + 's' : ''); }
        var sum = card.querySelector('.sum');
        if (sum && summary) { sum.textContent = summary; }
      },
      updateProcessHead: function (done) {
        if (this.steps === 0 && this.subCount === 0) {
          if (done) { this.process.style.display = 'none'; }
          return;
        }
        this.process.classList.toggle('done', !!done);
        var parts = [];
        if (this.steps) { parts.push(this.steps + ' 次工具调用'); }
        if (this.subCount) { parts.push(this.subCount + ' 位专家'); }
        if (done) {
          parts.push(this.rounds ? this.rounds + ' 轮推理' : '');
          this.processText.textContent = '已完成 · ' + parts.filter(Boolean).join(' · ') + ' · 点开查看过程';
        } else {
          var live = this.processText.textContent;
          if (!live || live === '准备中…') { this.processText.textContent = parts.join(' · '); }
        }
      }
    };
    node.processHead.addEventListener('click', function () { node.process.classList.toggle('open'); });
    return node;
  }

  function setBusy(busy, label) {
    state.busy = busy;
    sendEl.textContent = busy ? '■' : '↑';
    sendEl.className = 'send-btn' + (busy ? ' stop' : '');
    sendEl.title = busy ? '停止生成' : '发送';
    statusEl.className = 'tb-status' + (busy ? ' busy' : '');
    statusText.textContent = busy ? (label || '思考中') : '在线';
  }
  function setIdle() { statusEl.className = 'tb-status'; statusText.textContent = '在线'; }

  function metaOf(d) {
    var p = [];
    if (d.tools_used && d.tools_used.length) { p.push(d.tools_used.length + ' 个工具'); }
    if (d.rounds != null) { p.push(d.rounds + ' 轮'); }
    if (d.latency_ms != null) { p.push((Math.round(d.latency_ms / 100) / 10) + 's'); }
    if (d.usage && d.usage.total_tokens) { p.push(d.usage.total_tokens + ' tokens' + (d.usage.estimated ? '(估算)' : '')); }
    return p.join(' · ');
  }

  /* ================= SSE ================= */
  function readSse(resp, handlers) {
    var reader = resp.body.getReader();
    var decoder = new TextDecoder('utf-8');
    var buffer = '';
    function pump() {
      return reader.read().then(function (chunk) {
        if (chunk.done) { return; }
        buffer += decoder.decode(chunk.value, { stream: true });
        var idx;
        while ((idx = buffer.indexOf('\n\n')) >= 0) {
          var raw = buffer.slice(0, idx);
          buffer = buffer.slice(idx + 2);
          var event = 'message', data = [];
          raw.split('\n').forEach(function (line) {
            if (line.indexOf('event:') === 0) { event = line.slice(6).trim(); }
            else if (line.indexOf('data:') === 0) { data.push(line.slice(5).trim()); }
          });
          if (!data.length) { continue; }
          var payload;
          try { payload = JSON.parse(data.join('\n')); } catch (e) { payload = null; }
          if (handlers[event]) { handlers[event](payload || {}); }
        }
        return pump();
      });
    }
    return pump();
  }

  function send(text) {
    text = (text || '').trim();
    if (!text || state.busy) { return; }
    hideHero();
    setBusy(true, '思考中');
    state.autoScroll = true;
    addUserMsg(text);
    inputEl.value = '';
    resizeInput();
    charEl.textContent = '0 / 4000';

    var bot = addBotMsg();
    var pendingTools = {};
    var pendingSubs = {};
    state.controller = new AbortController();
    var finished = false;

    function finalize() {
      if (finished) { return; }
      finished = true;
      bot.finish();
    }

    fetch('/cs-api/chat/agent/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'text/event-stream' },
      signal: state.controller.signal,
      body: JSON.stringify({
        message: text,
        user_id: state.userId,
        conv_id: state.conversationId,
        auth_token: state.authToken
      })
    }).then(function (resp) {
      if (!resp.ok) {
        return resp.text().then(function (detail) {
          throw new Error('HTTP ' + resp.status + (detail ? '：' + detail.slice(0, 140) : ''));
        });
      }
      return readSse(resp, {
        meta: function (d) { if (d.conversation_id) { state.conversationId = d.conversation_id; } },
        round: function (d) {
          bot.rounds = (d.round != null ? d.round : bot.rounds + 1);
          bot.setStatus('第 ' + bot.rounds + ' 轮推理中…');
        },
        delta: function (d) {
          bot.setStatus('正在整理回答…');
          bot.append(d.text || '');
        },
        reset: function () { bot.text = ''; },
        tool_start: function (d) {
          bot.setStatus('正在调用「' + (d.tool || '工具') + '」…');
          pendingTools[d.tool] = bot.addStep(d.tool, d.summary);
        },
        tool_end: function (d) {
          var done = pendingTools[d.tool];
          if (done) { done(d.success !== false, d.latency_ms); }
          bot.setStatus('正在分析结果…');
        },
        subagent_start: function (d) {
          bot.setStatus('已委派给「' + (d.name || d.role) + '」…');
          pendingSubs[d.role] = bot.addSub(d.role, d.name, d.task);
        },
        subagent_end: function (d) {
          bot.endSub(pendingSubs[d.role], d.success !== false, d.latency_ms, d.summary);
          bot.setStatus('正在汇总专家结论…');
        },
        approval: function (d) {
          finalize();
          showApproval(d);
        },
        done: function (d) {
          if (d.response != null && !bot.text) { bot.setText(d.response); }
          bot.rounds = d.rounds != null ? d.rounds : bot.rounds;
          finalize();
          bot.foot.textContent = metaOf(d);
        },
        cancelled: function () {
          if (!bot.text) { bot.setText('（已停止）'); }
          finalize();
          bot.foot.textContent = '已停止生成';
        },
        error: function (d) {
          bot.setText('抱歉，' + (d.message || '服务暂时不可用') + '。');
          finalize();
        },
        ping: function () {}
      });
    }).then(function () {
      finalize();
    }).catch(function (err) {
      if (err && err.name === 'AbortError') {
        if (!bot.text) { bot.setText('（已停止）'); }
        finalize();
        bot.foot.textContent = '已停止生成';
      } else {
        bot.setText('连接助手失败：' + (err && err.message ? err.message : '未知错误') + '\n\n请确认 EchoMind 服务（18080）已启动。');
        finalize();
        statusEl.className = 'tb-status off';
        statusText.textContent = '服务未启动';
      }
    }).then(function () {
      state.controller = null;
      if (!state.busy) { return; }
      setBusy(false);
      setIdle();
      inputEl.focus();
    });
  }

  function showApproval(d) {
    var el = document.createElement('div');
    el.className = 'msg bot';
    el.innerHTML =
      '<div class="avatar bot">AI</div>' +
      '<div class="body"><div class="approve-card">' +
        '<div class="ah">⚠ 需要你确认</div>' +
        '<div class="ad">' + esc(d.response || '这是一次会改变数据的操作，确认后才会执行。') + '</div>' +
        '<div class="aa"><button class="btn-brand" data-act="yes">确认执行</button>' +
        '<button class="btn-ghost" data-act="no">取消</button></div>' +
      '</div></div>';
    chatInner.appendChild(el);
    scrollBottom(true);
    el.querySelector('[data-act="yes"]').addEventListener('click', function () { approve(d.pending_token, true, el); });
    el.querySelector('[data-act="no"]').addEventListener('click', function () { approve(d.pending_token, false, el); });
  }

  function approve(token, approved, cardEl) {
    var actions = cardEl.querySelector('.aa');
    if (actions) { actions.remove(); }
    var bot = addBotMsg();
    setBusy(true, '处理中');
    fetch('/cs-api/chat/approve', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        conversation_id: state.conversationId,
        pending_token: token,
        approved: approved,
        auth_token: state.authToken
      })
    }).then(function (r) {
      if (!r.ok) { throw new Error('HTTP ' + r.status); }
      return r.json();
    }).then(function (d) {
      bot.setText(d.response || '（已处理）');
      bot.finish();
      bot.foot.textContent = metaOf(d);
    }).catch(function (err) {
      bot.setText('操作处理失败（' + err.message + '）。');
      bot.finish();
    }).then(function () {
      setBusy(false);
      setIdle();
    });
  }

  /* ================= 抽屉 ================= */
  var segButtons = Array.prototype.slice.call(document.querySelectorAll('#seg button'));

  function openDrawer(tab) {
    tab = tab || 'memory';
    app.classList.add('drawer-open');
    document.getElementById('drawer').classList.add('open');
    setTab(tab);
    if (tab === 'agents' && !state.agentsLoaded) { loadAgents(); }
    if (tab === 'memory') { loadMemories(); }
  }
  function closeDrawer() {
    app.classList.remove('drawer-open');
    document.getElementById('drawer').classList.remove('open');
  }
  function setTab(tab) {
    state.drawerTab = tab;
    segButtons.forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-tab') === tab); });
    Array.prototype.forEach.call(document.querySelectorAll('.tab-panel'), function (p) {
      p.classList.toggle('active', p.id === 'panel-' + tab);
    });
    if (tab === 'agents' && !state.agentsLoaded) { loadAgents(); }
    if (tab === 'memory') { loadMemories(); }
  }

  segButtons.forEach(function (b) {
    b.addEventListener('click', function () { setTab(b.getAttribute('data-tab')); });
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-drawer]'), function (b) {
    b.addEventListener('click', function () { openDrawer(b.getAttribute('data-drawer')); });
  });
  document.getElementById('drawerClose').addEventListener('click', closeDrawer);
  document.getElementById('mask').addEventListener('click', closeDrawer);
  document.getElementById('railMemory').addEventListener('click', function () { openDrawer('memory'); });
  document.getElementById('railExit').addEventListener('click', exitLogin);

  /* ================= 功能入口 ================= */
  var FUNCS = [
    { ico: '🔍', title: '找店铺', desc: '分类浏览、名称搜索、附近 5 公里', href: '/shop-list.html', ask: '附近有什么好吃的？' },
    { ico: '🎫', title: '优惠券与秒杀', desc: '店铺在售券、限时秒杀（需确认）', href: '/shop-list.html', ask: '现在有可以抢的秒杀券吗？' },
    { ico: '📦', title: '我的订单', desc: '状态、支付、核销、退款', href: '/order.html', ask: '帮我看看我的订单' },
    { ico: '📝', title: '探店笔记', desc: '热门笔记与发布', href: '/index.html', ask: '最近有什么热门的探店笔记？' },
    { ico: '🙋', title: '个人中心', desc: '资料、签到、关注与粉丝', href: '/info.html', ask: '我连续签到多少天了？' },
    { ico: '🔐', title: '登录', desc: '登录后才能查订单与记忆', href: '/login.html' }
  ];
  (function renderFuncs() {
    var box = document.getElementById('funcList');
    box.innerHTML = FUNCS.map(function (f, i) {
      return '<div class="fn-row"><div class="fi">' + f.ico + '</div>' +
        '<div class="ft"><b>' + f.title + '</b><span>' + f.desc + '</span></div>' +
        '<div class="fa"><button class="mini-btn" data-ask-i="' + i + '">问助手</button>' +
        (f.href ? '<a class="mini-btn" href="' + f.href + '">打开</a>' : '') + '</div></div>';
    }).join('');
    box.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-ask-i]');
      if (!btn) { return; }
      var f = FUNCS[+btn.getAttribute('data-ask-i')];
      closeDrawer();
      send(f.ask);
    });
  })();

  /* ================= 专家面板 ================= */
  function loadAgents() {
    var box = document.getElementById('agentsBox');
    fetch('/cs-api/agents').then(function (r) { return r.json(); }).then(function (d) {
      state.agentsLoaded = true;
      var main = d.main || {};
      var subs = d.subagents || [];
      document.getElementById('agentCount').textContent = subs.length + ' 位';
      var writes = main.writes || [];
      var tools = main.tools || [];
      var shown = tools.slice(0, 10);
      var html = '<div class="agent-card main"><div class="ah"><b>' + esc(main.name || '主助手') + '</b><span class="badge">主控</span></div>' +
        '<div class="ad">理解需求、编排专家、统一执行写操作并请求确认。</div><div class="tags">' +
        shown.map(function (t) {
          return '<span class="tag' + (writes.indexOf(t) >= 0 ? ' w' : '') + '">' + esc(t) + '</span>';
        }).join('') +
        (tools.length > shown.length ? '<span class="tag">…共 ' + tools.length + ' 个</span>' : '') +
        '</div></div>';

      html += subs.map(function (s) {
        return '<div class="agent-card"><div class="ah"><b>' + esc(s.name) + '</b><span class="badge">只读</span></div>' +
          '<div class="ad">角色 ' + esc(s.role) + ' · 最多 ' + s.max_rounds + ' 轮 · 超时 ' + s.timeout_seconds + 's</div>' +
          '<div class="tags">' + (s.tools || []).map(function (t) { return '<span class="tag r">' + esc(t) + '</span>'; }).join('') + '</div></div>';
      }).join('');
      box.innerHTML = html;
    }).catch(function () {
      box.innerHTML = '<div class="empty-sm">无法加载专家清单<br>请确认 EchoMind 服务已启动</div>';
    });
  }

  /* ================= 记忆面板 ================= */
  function memUser() { return state.userId && state.userId !== 'anonymous' ? state.userId : null; }

  function loadMemories() {
    var list = document.getElementById('memList');
    var banner = document.getElementById('memBanner');
    var uid = memUser();
    if (!uid) {
      banner.innerHTML = '<div class="banner-sm">游客模式下没有长期记忆，<a href="/login.html">登录</a>后助手会记住你的偏好。</div>';
      document.getElementById('memForm').style.display = 'none';
      document.getElementById('memCount').textContent = '';
      list.innerHTML = '<div class="empty-sm">登录后可查看与新增记忆</div>';
      return;
    }
    document.getElementById('memForm').style.display = '';
    banner.innerHTML = '';
    fetch('/cs-api/memory?user_id=' + encodeURIComponent(uid))
      .then(function (r) { return r.json(); })
      .then(function (d) { renderMemories(d.items || []); })
      .catch(function () { list.innerHTML = '<div class="empty-sm">加载失败，请稍后重试</div>'; });
  }

  var TYPE_LABEL = { user: '用户偏好', feedback: '反馈习惯', project: '项目资料', reference: '参考资料' };

  function renderMemories(items) {
    var list = document.getElementById('memList');
    document.getElementById('memCount').textContent = items.length ? items.length + ' 条' : '';
    if (!items.length) {
      list.innerHTML = '<div class="empty-sm">还没有记忆。<br>试试对助手说「我更喜欢川菜，人均 80」，它会自己记下来。</div>';
      return;
    }
    list.innerHTML = items.map(function (m) {
      var when = m.updated_at || m.updatedAt || '';
      when = String(when).replace('T', ' ').slice(0, 16);
      return '<div class="mem-item"><div class="mh"><span class="mt">' + esc(m.title) + '</span>' +
        '<span class="mtype t-' + esc(m.type || 'user') + '">' + esc(TYPE_LABEL[m.type] || m.type || '用户偏好') + '</span></div>' +
        '<div class="md">' + esc(m.description || '') + '</div>' +
        '<div class="mf"><span>' + (when || '') + '</span><span>' + (m.chars || 0) + ' 字</span>' +
        '<button class="del" data-file="' + esc(m.file) + '">删除</button></div></div>';
    }).join('');
    Array.prototype.forEach.call(list.querySelectorAll('.del'), function (b) {
      b.addEventListener('click', function () { deleteMemory(b.getAttribute('data-file')); });
    });
  }

  function saveMemory() {
    var uid = memUser();
    if (!uid) { toast('请先登录'); return; }
    var title = document.getElementById('memTitle').value.trim();
    var content = document.getElementById('memContent').value.trim();
    var type = document.getElementById('memType').value;
    if (!title || !content) { toast('标题和内容都要填'); return; }
    fetch('/cs-api/memory', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_id: uid, title: title, content: content, type: type })
    }).then(function (r) {
      if (!r.ok) { throw new Error('HTTP ' + r.status); }
      return r.json();
    }).then(function (d) {
      document.getElementById('memTitle').value = '';
      document.getElementById('memContent').value = '';
      setMemEditing(false);
      renderMemories(d.items || []);
      toast('已保存');
    }).catch(function (e) { toast('保存失败：' + e.message); });
  }

  function deleteMemory(file) {
    var uid = memUser();
    if (!uid || !file) { return; }
    fetch('/cs-api/memory?user_id=' + encodeURIComponent(uid) + '&file=' + encodeURIComponent(file), { method: 'DELETE' })
      .then(function (r) { return r.json(); })
      .then(function (d) { renderMemories(d.items || []); toast(d.deleted ? '已删除' : '删除失败'); })
      .catch(function () { toast('删除失败'); });
  }

  document.getElementById('memSave').addEventListener('click', saveMemory);
  var memFormEl = document.getElementById('memForm');
  function setMemEditing(on) {
    memFormEl.classList.toggle('open', on);
    document.getElementById('panel-memory').classList.toggle('editing', on);
    if (on) { setTimeout(function () { document.getElementById('memTitle').focus(); }, 30); }
  }
  document.getElementById('memAdd').addEventListener('click', function () { setMemEditing(true); });
  document.getElementById('memCancel').addEventListener('click', function () {
    document.getElementById('memTitle').value = '';
    document.getElementById('memContent').value = '';
    setMemEditing(false);
  });

  /* ================= 身份 ================= */
  function resolveUser() {
    var token = readToken();
    if (!token) { return Promise.resolve(); }
    state.authToken = token;
    return fetch('/api/user/me', { headers: { authorization: token } })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j && j.data && j.data.id != null) {
          state.userId = 'u' + j.data.id;
          var nick = j.data.nickName || '';
          // 注册默认昵称形如 user_3a6ggu，直接显示很丑，统一收敛成「我的账号」
          if (!nick || /^user_/i.test(nick)) { nick = '我的账号'; }
          var nameEl = document.getElementById('userName');
          var avEl = document.getElementById('userAvatar');
          if (nameEl) { nameEl.textContent = nick; }
          var chipEl = document.getElementById('userChip');
          if (chipEl) { chipEl.href = '/info.html'; chipEl.title = '个人中心'; }
          if (avEl) {
            if (j.data.icon) { avEl.innerHTML = '<img src="' + esc(j.data.icon) + '" alt="">'; }
            else { avEl.textContent = nick.slice(0, 1); }
          }
          if (state.drawerTab === 'memory') { loadMemories(); }
        }
      })
      .catch(function () {});
  }

  function exitLogin() {
    var token = state.authToken;
    function done() {
      try { sessionStorage.removeItem('token'); } catch (e) {}
      try { localStorage.removeItem('token'); } catch (e) {}
      toast('已退出，正在返回登录页…');
      setTimeout(function () { location.href = '/login.html'; }, 600);
    }
    if (!token) { done(); return; }
    fetch('/api/user/logout', { method: 'POST', headers: { authorization: token } }).then(done).catch(done);
  }

  /* ================= 输入 ================= */
  function resizeInput() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
  }
  inputEl.addEventListener('input', function () {
    resizeInput();
    charEl.textContent = inputEl.value.length + ' / 4000';
    sendEl.disabled = !state.busy && !inputEl.value.trim();
  });
  inputEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!state.busy) { send(inputEl.value); }
    }
  });
  sendEl.addEventListener('click', function () {
    if (state.busy) { if (state.controller) { state.controller.abort(); } return; }
    send(inputEl.value);
  });
  sendEl.disabled = true;

  document.getElementById('heroCards').addEventListener('click', function (e) {
    var card = e.target.closest('[data-ask]');
    if (card) { send(card.getAttribute('data-ask')); }
  });

  document.getElementById('btnNew').addEventListener('click', newChat);
  document.getElementById('railNew').addEventListener('click', newChat);

  function newChat() {
    if (state.busy && state.controller) { state.controller.abort(); }
    state.conversationId = 'c-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
    Array.prototype.forEach.call(chatInner.querySelectorAll('.msg'), function (m) { m.remove(); });
    if (hero) { hero.style.display = ''; }
    chatInner.classList.add('empty');
    state.autoScroll = true;
    toast('已开启新对话');
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeDrawer(); }
  });

  /* ================= 启动 ================= */
  function health() {
    fetch('/cs-api/health').then(function (r) {
      if (!r.ok) { throw new Error('bad'); }
      setIdle();
    }).catch(function () {
      statusEl.className = 'tb-status off';
      statusText.textContent = '服务未启动';
    });
  }

  function deepLink() {
    var q = new URLSearchParams(location.search);
    var tab = q.get('tab');
    if (tab) { openDrawer(tab); }
    var ask = q.get('q');
    var shopId = q.get('shopId') || q.get('shop_id');
    if (!ask && shopId) { ask = '帮我看看店铺（id=' + shopId + '）的详情和优惠券'; }
    if (ask) { setTimeout(function () { send(ask); }, 260); }
  }

  resolveUser().then(function () {
    health();
    deepLink();
    inputEl.focus();
    scrollBottom(true);
  });
})();
</script>
