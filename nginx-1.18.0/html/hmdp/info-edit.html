<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>黑马点评</title>
  <!-- 引入样式 -->
  <link rel="stylesheet" href="./css/element.css">
  <link href="./css/main.css" rel="stylesheet">
  <link href="./css/info.css" rel="stylesheet">

  <style type="text/css">
    .info-item { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .info-item:active { background: #fafafa; }
    .picker-dialog .el-dialog__body { padding: 10px 20px 20px; }
    .gender-row { display: flex; gap: 12px; margin-top: 6px; }
    .gender-btn {
      flex: 1; height: 40px; line-height: 40px; text-align: center;
      border: 1px solid #dcdfe6; border-radius: 20px; color: #606266;
    }
    .gender-btn.active { border-color: #ff6633; color: #ff6633; background: #fff5f0; }
  </style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="header-back-btn" @click="goBack" ><i class="el-icon-arrow-left"></i></div>
    <div class="header-title">资料编辑&nbsp;&nbsp;&nbsp;</div>
  </div>
  <div class="edit-container">
    <div class="info-box">
      <div class="info-item">
        <div class="info-label">头像</div>
        <div class="info-btn">
          <img width="35" :src="user.icon || '/imgs/icons/default-icon.png'" alt="">
          <div><i class="el-icon-arrow-right"></i></div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="info-item" @click="editNickname">
        <div class="info-label">昵称</div>
        <div class="info-btn">
          <div>{{user.nickName}}</div>
          <div><i class="el-icon-arrow-right"></i></div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="info-item" @click="editIntroduce">
        <div class="info-label">个人介绍</div>
        <div class="info-btn">
          <div style="overflow: hidden; width: 150px;text-align: right">{{info.introduce || '介绍一下自己'}}</div>
          <div><i class="el-icon-arrow-right"></i></div>
        </div>
      </div>
    </div>
    <div class="info-box">
      <div class="info-item" @click="openGender">
        <div class="info-label">性别</div>
        <div class="info-btn">
          <div>{{genderText}}</div>
          <div><i class="el-icon-arrow-right"></i></div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="info-item" @click="editCity">
        <div class="info-label">城市</div>
        <div class="info-btn">
          <div>{{info.city || '选择'}}</div>
          <div><i class="el-icon-arrow-right"></i></div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="info-item" @click="editBirthday">
        <div class="info-label">生日</div>
        <div class="info-btn">
          <div>{{info.birthday || '添加'}}</div>
          <div><i class="el-icon-arrow-right"></i></div>
        </div>
      </div>
    </div>

    <div class="info-box">
      <div class="info-item">
        <div class="info-label">我的积分</div>
        <div class="info-btn">
          <div>查看积分</div>
          <div><i class="el-icon-arrow-right"></i></div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="info-item">
        <div class="info-label">会员等级</div>
        <div class="info-btn">
          <div><a href="javascript:void(0)">成为VIP尊享特权</a></div>
          <div><i class="el-icon-arrow-right"></i></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 性别/生日选择弹窗 -->
  <el-dialog title="选择性别" :visible.sync="genderVisible" width="80%" class="picker-dialog" append-to-body>
    <div class="gender-row">
      <div class="gender-btn" :class="{active: genderValue === false}" @click="chooseGender(false)">男</div>
      <div class="gender-btn" :class="{active: genderValue === true}" @click="chooseGender(true)">女</div>
    </div>
  </el-dialog>
  <el-dialog title="选择生日" :visible.sync="birthdayVisible" width="80%" class="picker-dialog" append-to-body>
    <el-date-picker v-model="birthdayValue" type="date" placeholder="选择日期"
                    value-format="yyyy-MM-dd" :picker-options="birthdayOptions" style="width: 100%"></el-date-picker>
    <div style="text-align: right; margin-top: 12px">
      <el-button size="mini" @click="birthdayVisible = false">取消</el-button>
      <el-button size="mini" type="primary" @click="confirmBirthday">确定</el-button>
    </div>
  </el-dialog>
  <foot-bar :active-btn="4"></foot-bar>
</div>
<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<!-- 引入组件库 -->
<script src="./js/element.js"></script>
<script src="./js/common.js"></script>
<script src="./js/footer.js"></script>
<script>

  const app = new Vue({
    el: "#app",
    data: {
      util,
      user: {},
      info: {},
      genderVisible: false,
      genderValue: null,
      birthdayVisible: false,
      birthdayValue: "",
      birthdayOptions: {
        disabledDate(time) {
          return time.getTime() > Date.now();
        }
      },
      saving: false
    },
    computed: {
      genderText() {
        if (this.info.gender === true) return "女";
        if (this.info.gender === false) return "男";
        return "未设置";
      }
    },
    created() {
      this.checkLogin();
    },
    methods: {
      checkLogin() {
        axios.get("/user/me")
          .then(({data}) => {
            this.user = data;
            this.info = JSON.parse(sessionStorage.getItem("userInfo")) || {};
            // 本地没有缓存（比如从别处进入），兜底拉一次详情
            if (!this.info.userId) {
              this.queryInfo();
            }
          })
          .catch(err => {
            this.$message.error(err);
            setTimeout(() => location.href = "login.html", 1000);
          })
      },
      queryInfo() {
        axios.get("/user/info/" + this.user.id)
          .then(({data}) => {
            this.info = data || {};
            if (data) {
              sessionStorage.setItem("userInfo", JSON.stringify(data));
            }
          })
          .catch(() => {})
      },
      editNickname() {
        this.$prompt("请输入新昵称", "修改昵称", {
          inputValue: this.user.nickName,
          inputPattern: /^\S.{0,31}$/,
          inputErrorMessage: "昵称 1~32 个字"
        }).then(({value}) => this.save({nickName: value}))
          .catch(() => {});
      },
      editIntroduce() {
        this.$prompt("介绍一下自己吧（128 字内）", "个人介绍", {
          inputValue: this.info.introduce || "",
          inputType: "textarea",
          inputValidator: v => (!v || v.length <= 128) || "最多 128 个字"
        }).then(({value}) => this.save({introduce: value}))
          .catch(() => {});
      },
      editCity() {
        this.$prompt("所在城市", "修改城市", {
          inputValue: this.info.city || "",
          inputValidator: v => (!v || v.length <= 32) || "城市名过长"
        }).then(({value}) => this.save({city: value}))
          .catch(() => {});
      },
      openGender() {
        this.genderValue = this.info.gender === null || this.info.gender === undefined ? null : this.info.gender;
        this.genderVisible = true;
      },
      chooseGender(v) {
        this.genderValue = v;
        this.genderVisible = false;
        this.save({gender: v});
      },
      editBirthday() {
        this.birthdayValue = this.info.birthday || "";
        this.birthdayVisible = true;
      },
      confirmBirthday() {
        this.birthdayVisible = false;
        this.save({birthday: this.birthdayValue || null});
      },
      save(patch) {
        if (this.saving) {
          return;
        }
        this.saving = true;
        axios.put("/user/info", patch)
          .then(() => {
            this.$message.success("已保存");
            if (patch.nickName) {
              this.user.nickName = patch.nickName;
            }
            this.queryInfo();
          })
          .catch(err => this.$message.error(err))
          .finally(() => this.saving = false);
      },
      goBack() {
        history.back();
      }
    }
  })
</script>
<script src="/js/assistant-entry.js"></script>
</body>
</html>
