<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>黑马点评</title>
  <!-- 引入样式 -->
  <link rel="stylesheet" href="./css/element.css">

  <link href="./css/index.css" rel="stylesheet">
  <link href="./css/main.css" rel="stylesheet">

  <style type="text/css">
      .el-input__inner {
          border-radius: 20px;
      }
      /* 原来的 7% / 25% / 60% 固定高度在店铺分类有 10 个、屏幕比例不同时会互相遮挡，
         这里改成纵向 flex，列表自己滚动，底部导航固定 */
      #app {
          display: flex;
          flex-direction: column;
      }
      .search-bar {
          flex: 0 0 auto;
          height: auto;
          padding: 8px;
          min-height: 44px;
          box-sizing: border-box;
      }
      .type-list {
          flex: 0 0 auto;
          height: auto;
          padding: 8px 0 2px 0;
      }
      .type-box {
          width: 19%;
          min-width: 0;
      }
      .type-text {
          word-break: break-all;
          line-height: 1.3;
          margin-top: 2px;
      }
      .blog-list {
          flex: 1 1 auto;
          height: auto;
          min-height: 0;
          padding-bottom: 76px;
          box-sizing: border-box;
          overflow-x: hidden;
      }
      .blog-box {
          min-width: 0;
      }
      .blog-title {
          word-break: break-word;
          overflow: hidden;
          display: -webkit-box;
          -webkit-line-clamp: 2;
          -webkit-box-orient: vertical;
      }
      .blog-user-name {
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
      }
      html, body { overflow-x: hidden; }
      .search-input { position: relative; }
      .suggest-panel {
          position: fixed;
          left: 8px;
          right: 8px;
          top: 46px;
          max-height: 52vh;
          overflow-y: auto;
          background: #fff;
          border-radius: 8px;
          box-shadow: 0 8px 24px rgba(0, 0, 0, .18);
          z-index: 1200;
          padding: 4px 0;
      }
      .suggest-item {
          display: flex;
          align-items: center;
          padding: 8px 12px;
          border-bottom: 1px solid #f5f5f5;
      }
      .suggest-item:active { background: #fafafa; }
      .suggest-item img {
          width: 42px; height: 42px; border-radius: 6px;
          object-fit: cover; background: #f2f2f2; flex: 0 0 auto;
      }
      .suggest-info { flex: 1; min-width: 0; padding: 0 10px; }
      .suggest-name {
          font-size: 14px; color: #333; font-weight: 600;
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .suggest-addr {
          font-size: 12px; color: #999; margin-top: 2px;
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .suggest-price { font-size: 12px; color: #ff6633; flex: 0 0 auto; }
      .suggest-tip {
          text-align: center; font-size: 12px; color: #999; padding: 14px 0;
      }
      .blog-skeleton {
          width: 48%; background: #fff; margin: 5px 0; border-radius: 3px;
          height: 150px; overflow: hidden;
      }
      .blog-skeleton .sk-img {
          height: 100px;
          background: linear-gradient(90deg, #f0f0f0 25%, #f8f8f8 37%, #f0f0f0 63%);
          background-size: 400% 100%;
          animation: sk 1.4s ease infinite;
      }
      .blog-skeleton .sk-line {
          height: 10px; margin: 8px 10px; border-radius: 4px;
          background: linear-gradient(90deg, #f0f0f0 25%, #f8f8f8 37%, #f0f0f0 63%);
          background-size: 400% 100%;
          animation: sk 1.4s ease infinite;
      }
      @keyframes sk { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
      .list-foot {
          width: 100%; text-align: center; font-size: 12px;
          color: #999; padding: 10px 0 18px 0;
      }
      .list-empty {
          width: 100%; text-align: center; color: #999;
          font-size: 13px; padding: 60px 20px;
      }
      .search-hint {
          position: absolute; left: 12px; top: 100%; margin-top: 6px;
          font-size: 12px; color: #ffe6dc;
      }
  </style>
</head>
<body>
<div id="app">
  <div class="search-bar">
    <div class="city-btn">杭州 <i class="el-icon-arrow-down"></i></div>
    <div class="search-input">
      <el-input v-model="keyword" size="mini" placeholder="搜索店铺名、地点" clearable
                @keyup.enter.native="doSearch"
                @input="onKeywordInput"
                @clear="closeSuggest"
                @blur="onBlur">
        <i slot="prefix" class="el-input__icon el-icon-search"></i>
      </el-input>
      <div class="suggest-panel" v-if="suggestVisible">
        <div class="suggest-item" v-for="s in suggestList" :key="s.id" @mousedown.prevent="toShop(s.id)">
          <img :src="shopCover(s)" alt="" @error="onImgError">
          <div class="suggest-info">
            <div class="suggest-name">{{s.name}}</div>
            <div class="suggest-addr">{{s.area || ''}}{{s.area ? ' · ' : ''}}{{s.address || ''}}</div>
          </div>
          <div class="suggest-price">{{s.avgPrice ? '￥' + s.avgPrice + '/人' : ''}}</div>
        </div>
        <div class="suggest-tip" v-if="suggestLoading">搜索中…</div>
        <div class="suggest-tip" v-else-if="keyword && !suggestList.length">没有找到「{{keyword}}」相关的店铺</div>
      </div>
    </div>
    <div class="header-icon" @click="toMyInfo"><i class="el-icon-user"></i></div>
  </div>
  <div class="type-list">
    <div class="type-box" v-for="t in types" :key="t.id" @click="toShopList(t.id, t.name)">
      <div class="type-view"><img :src="'/imgs/' + t.icon" alt="" @error="onImgError"></div>
      <div class="type-text">{{t.name}}</div>
    </div>
  </div>
  <div class="blog-list" @scroll="onScroll">
    <div class="blog-box" v-for="b in blogs" :key="b.id">
      <div class="blog-img" @click="toBlogDetail(b)">
        <img :src="b.img" alt="" loading="lazy" @error="onImgError">
      </div>
      <div class="blog-title">{{b.title}}</div>
      <div class="blog-foot">
        <div class="blog-user-icon"><img :src="b.icon || '/imgs/icons/default-icon.png'" alt="" @error="onImgError"></div>
        <div class="blog-user-name">{{b.name}}</div>
        <div class="blog-liked" @click.stop="addLike(b)">
          <svg t="1646634642977" class="icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" p-id="2187" width="14" height="14">
            <path d="M160 944c0 8.8-7.2 16-16 16h-32c-26.5 0-48-21.5-48-48V528c0-26.5 21.5-48 48-48h32c8.8 0 16 7.2 16 16v448zM96 416c-53 0-96 43-96 96v416c0 53 43 96 96 96h96c17.7 0 32-14.3 32-32V448c0-17.7-14.3-32-32-32H96zM505.6 64c16.2 0 26.4 8.7 31 13.9 4.6 5.2 12.1 16.3 10.3 32.4l-23.5 203.4c-4.9 42.2 8.6 84.6 36.8 116.4 28.3 31.7 68.9 49.9 111.4 49.9h271.2c6.6 0 10.8 3.3 13.2 6.1s5 7.5 4 14l-48 303.4c-6.9 43.6-29.1 83.4-62.7 112C815.8 944.2 773 960 728.9 960h-317c-33.1 0-59.9-26.8-59.9-59.9v-455c0-6.1 1.7-12 5-17.1 69.5-109 106.4-234.2 107-364h41.6z m0-64h-44.9C427.2 0 400 27.2 400 60.7c0 127.1-39.1 251.2-112 355.3v484.1c0 68.4 55.5 123.9 123.9 123.9h317c122.7 0 227.2-89.3 246.3-210.5l47.9-303.4c7.8-49.4-30.4-94.1-80.4-94.1H671.6c-50.9 0-90.5-44.4-84.6-95l23.5-203.4C617.7 55 568.7 0 505.6 0z" p-id="2188" :fill="b.isLike ? '#ff6633' : '#82848a'"></path>
          </svg>
          {{b.liked || 0}}
        </div>
      </div>
    </div>
    <!-- 首屏骨架屏 -->
    <template v-if="firstLoading">
      <div class="blog-skeleton" v-for="i in 4" :key="'sk' + i">
        <div class="sk-img"></div>
        <div class="sk-line" style="width: 70%"></div>
        <div class="sk-line" style="width: 40%"></div>
      </div>
    </template>
    <div class="list-empty" v-if="!firstLoading && !blogs.length">还没有探店笔记，去发布第一篇吧～</div>
    <div class="list-foot" v-if="!firstLoading && blogs.length">
      {{loading ? '加载中…' : (noMore ? '— 已经到底啦 —' : '上滑加载更多')}}
    </div>
  </div>
  <foot-bar :active-btn="1"></foot-bar>
</div>
<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<!-- 引入组件库 -->
<script src="./js/element.js"></script>
<script src="./js/common.js"></script>
<script src="./js/footer.js"></script>
<script>

  const app = new Vue({
    el: "#app",
    data: {
      util,
      types: [], // 类型列表
      blogs: [], // 播客列表
      current: 1,// blog的页码
      loading: false,
      firstLoading: true,
      noMore: false,
      // 搜索
      keyword: "",
      suggestVisible: false,
      suggestLoading: false,
      suggestList: []
    },
    created() {
      this.queryTypes();
      this.queryHotBlogsScroll();
      this._searchSoon = util.debounce(() => this.searchShops(), 260);
    },
    methods: {
      queryTypes() {
        axios.get("/shop-type/list")
          .then(({data}) => {
            this.types = data || [];
          })
          .catch(err => this.$message.error(err))
      },
      queryHotBlogsScroll() {
        if (this.loading || this.noMore) {
          return;
        }
        this.loading = true;
        axios.get("/blog/hot?current=" + this.current)
          .then(({data}) => {
            const rows = data || [];
            // 按 id 去重，避免分页期间有新数据插入导致重复卡片
            const exists = {};
            this.blogs.forEach(b => exists[b.id] = true);
            const fresh = rows.filter(b => !exists[b.id]).map(b => {
              b.img = util.firstImage(b.images);
              return b;
            });
            this.blogs = this.blogs.concat(fresh);
            // 后端每页固定 10 条，不足一页说明到底了
            this.noMore = rows.length < 10;
            this.current++;
          })
          .catch(err => {
            this.$message.error(err);
            this.noMore = true;
          })
          .finally(() => {
            this.loading = false;
            this.firstLoading = false;
          })
      },
      onScroll(e) {
        const el = e.target;
        // 提前 120px 触发，滚动更顺滑
        if (el.scrollTop + el.clientHeight + 120 >= el.scrollHeight) {
          this.queryHotBlogsScroll();
        }
      },
      addLike(b) {
        if (!util.isLogin()) {
          this.$message.warning("登录后就可以点赞啦");
          setTimeout(() => location.href = "/login.html", 600);
          return;
        }
        if (b._liking) {
          return;
        }
        b._liking = true;
        axios.put("/blog/like/" + b.id)
          .then(({data}) => {
            // 后端返回 true 表示本次是点赞，false 表示取消
            b.isLike = data === true;
            b.liked = Math.max((b.liked || 0) + (b.isLike ? 1 : -1), 0);
          })
          .catch(err => this.$message.error(err))
          .finally(() => b._liking = false);
      },
      onKeywordInput() {
        this.suggestVisible = true;
        if (!this.keyword) {
          this.suggestList = [];
          this.suggestLoading = false;
          return;
        }
        this.suggestLoading = true;
        this._searchSoon();
      },
      searchShops() {
        const kw = this.keyword.trim();
        if (!kw) {
          this.suggestLoading = false;
          return;
        }
        axios.get("/shop/of/name", {params: {name: kw, current: 1}})
          .then(({data}) => {
            if (this.keyword.trim() !== kw) {
              return; // 结果已过期，丢弃
            }
            this.suggestList = data || [];
          })
          .catch(err => {
            this.suggestList = [];
            this.$message.error(err);
          })
          .finally(() => this.suggestLoading = false)
      },
      doSearch() {
        const kw = this.keyword.trim();
        if (!kw) {
          return;
        }
        this.suggestVisible = true;
        this.suggestLoading = true;
        this.searchShops();
      },
      closeSuggest() {
        this.suggestVisible = false;
        this.suggestList = [];
      },
      onBlur() {
        // 延迟收起，保证点击建议项能先触发
        setTimeout(() => this.suggestVisible = false, 180);
      },
      shopCover(s) {
        return util.firstImage(s.images) || "/imgs/icons/default-icon.png";
      },
      onImgError(e) {
        util.imgFallback(e);
      },
      toShop(id) {
        location.href = "/shop-detail.html?id=" + id;
      },
      toShopList(id, name) {
        location.href = "/shop-list.html?type=" + id + "&name=" + encodeURIComponent(name || "")
      },
      toBlogDetail(b) {
        location.href = "/blog-detail.html?id=" + b.id
      },
      toMyInfo() {
        location.href = util.isLogin() ? "/info.html" : "/login.html";
      }
    }
  })
</script>

<!-- 智能助手入口：悬浮按钮 → chat.html（网购全流程助手/控制台） -->
<a href="/chat.html" class="cs-float-btn" title="智能助手：找店、挑券、下单、售后">🤖</a>
<style type="text/css">
    .cs-float-btn {
        position: fixed;
        right: 14px;
        bottom: 88px;
        z-index: 999;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #ff8a4c, #ff5a1f);
        color: #fff;
        font-size: 22px;
        text-decoration: none;
        box-shadow: 0 6px 16px rgba(255, 90, 31, .38);
        transition: transform .18s ease;
    }
    .cs-float-btn:hover { transform: translateY(-2px) scale(1.04); }
</style>
</body>
</html>
