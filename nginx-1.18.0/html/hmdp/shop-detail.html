<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>黑马点评</title>
  <!-- 引入样式 -->
  <link rel="stylesheet" href="./css/element.css">

  <link href="./css/shop-detail.css" rel="stylesheet">
  <link href="./css/main.css" rel="stylesheet">

  <style type="text/css">
    .page-loading,
    .page-empty {
      padding: 80px 20px;
      text-align: center;
      color: #82848a;
      font-size: 13px;
    }

    .shop-rate .el-rate {
      display: inline-block;
      vertical-align: middle;
    }

    /* 券卡片：售罄 / 未开始 / 已结束的统一弱化 */
    .voucher-box.is-disabled .voucher-left,
    .voucher-box.is-disabled .voucher-right {
      opacity: .6;
    }

    .voucher-countdown {
      font-size: 11px;
      color: #ff6633;
      margin-top: 2px;
    }

    .voucher-countdown.muted {
      color: #adacab;
    }

    /* 探店笔记卡片 */
    .note-card {
      display: flex;
      padding: 10px 0;
      border-bottom: 1px solid #f5f5f5;
    }

    .note-card:last-child {
      border-bottom: none;
    }

    .note-cover {
      width: 96px;
      height: 72px;
      border-radius: 6px;
      object-fit: cover;
      background: #f2f2f2;
      flex: 0 0 auto;
    }

    .note-body {
      flex: 1;
      min-width: 0;
      padding-left: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .note-title {
      font-size: 14px;
      color: #333;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .note-meta {
      display: flex;
      align-items: center;
      font-size: 12px;
      color: #82848a;
    }

    .note-avatar {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      margin-right: 6px;
      background: #f2f2f2;
    }

    .note-like {
      margin-left: auto;
      color: #ff6633;
    }

    .note-foot {
      text-align: center;
      font-size: 13px;
      color: #409eff;
      padding: 12px 0 4px 0;
    }

    .note-empty {
      text-align: center;
      font-size: 13px;
      color: #82848a;
      padding: 30px 0;
    }
  </style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="header-back-btn" @click="goBack"><i class="el-icon-arrow-left"></i></div>
    <div class="header-title"></div>
    <div class="header-share">...</div>
  </div>
  <div class="top-bar"></div>
  <div class="page-loading" v-if="!shop.id && loading">正在加载店铺信息…</div>
  <div class="page-empty" v-if="!shop.id && !loading">店铺不存在或已下架</div>
  <template v-if="shop.id">
    <div class="shop-info-box">
      <div class="shop-title">{{shop.name}}</div>
      <div class="shop-rate">
        <el-rate
            disabled :value="util.formatScore(shop.score)"
            text-color="#F63"
            show-score
        ></el-rate>
        <span>{{shop.comments || 0}}条</span>
      </div>
      <div class="shop-rate-info">
        <span v-if="shop.area">商圈：{{shop.area}}</span>
        <span v-if="shop.avgPrice">&nbsp;&nbsp;人均 ￥{{shop.avgPrice}}</span>
        <span v-if="shop.sold">&nbsp;&nbsp;已售 {{shop.sold}}</span>
      </div>
      <div class="shop-rank">
        <img src="/imgs/bd.png" width="63" height="20" alt="">
        <span>{{shop.area || '本区'}}好评榜</span>
        <div><i class="el-icon-arrow-right"></i></div>
      </div>
      <div class="shop-images">
        <div v-for="(s,i) in shop.images" :key="i">
          <img :src="s" alt="" @error="onImgError">
        </div>
      </div>
      <div class="shop-address">
        <div><i class="el-icon-map-location"></i></div>
        <span>{{shop.address}}</span>
        <div style="width: 10px; flex-grow: 2; text-align: center; color: #e1e2e3">|</div>
        <div style="margin: 0 5px"><img src="https://p0.meituan.net/travelcube/bf684aa196c870810655e45b1e52ce843484.png@24w_16h_40q" alt=""></div>
        <div><img src="https://p0.meituan.net/travelcube/9277ace32123e0c9f59dedf4407892221566.png@24w_24h_40q" alt=""></div>
      </div>
    </div>
    <div class="shop-divider"></div>
    <div class="shop-open-time">
      <span><i class="el-icon-watch"></i></span>
      <div>营业时间</div>
      <div>{{shop.openHours}}</div>
      <span class="line-right">查看详情 <i class="el-icon-arrow-right"></i></span>
    </div>
    <div class="shop-divider"></div>
    <div class="shop-voucher">
      <div>
        <span class="voucher-icon">券</span>
        <span style="font-weight: bold;">代金券</span>
      </div>
      <div class="voucher-box" v-for="v in vouchers" :key="v.id"
           :class="{'is-disabled': voucherState(v) !== 'ongoing' && v.type}">
        <div class="voucher-circle">
          <div class="voucher-b"></div>
          <div class="voucher-b"></div>
          <div class="voucher-b"></div>
        </div>
        <div class="voucher-left">
          <div class="voucher-title">{{v.title}}</div>
          <div class="voucher-subtitle">{{v.subTitle}}</div>
          <div class="voucher-price">
            <div>￥ {{util.formatPrice(v.payValue)}}</div>
            <span v-if="util.formatDiscount(v.payValue, v.actualValue)">{{util.formatDiscount(v.payValue, v.actualValue)}}</span>
          </div>
        </div>
        <div class="voucher-right">
          <template v-if="v.type">
            <div class="seckill-box">
              <div class="voucher-btn"
                   :class="{'disable-btn': voucherState(v) !== 'ongoing' || v.stock < 1 || buying}"
                   @click="seckill(v)">{{voucherBtnText(v)}}</div>
              <div class="seckill-stock" v-if="v.stock >= 0">剩余 <span>{{v.stock}}</span> 张</div>
              <div class="voucher-countdown" :class="{muted: voucherState(v) === 'ended'}">{{voucherTip(v)}}</div>
            </div>
          </template>
          <div class="voucher-btn" v-else>抢购</div>
        </div>
      </div>
      <div class="note-empty" v-if="!vouchers.length && !voucherLoading">这家店暂时没有可用代金券</div>
    </div>
    <div class="shop-divider"></div>
    <div class="shop-comments">
      <div class="comments-head">
        <div>探店笔记 <span>（{{blogTotal}}）</span></div>
        <div v-if="canLoadMoreBlogs" @click="loadBlogs"><i class="el-icon-arrow-right"></i></div>
      </div>
      <div class="comment-list">
        <div class="note-card" v-for="b in blogs" :key="b.id" @click="toBlog(b.id)">
          <img class="note-cover" :src="blogCover(b)" alt="" @error="onImgError">
          <div class="note-body">
            <div class="note-title">{{b.title}}</div>
            <div class="note-meta">
              <img class="note-avatar" :src="b.icon || '/imgs/icons/default-icon.png'" alt="" @error="onImgError">
              <span>{{b.name}}</span>
              <span class="note-like">♥ {{b.liked || 0}}</span>
            </div>
          </div>
        </div>
        <div class="note-empty" v-if="!blogs.length && !blogLoading">还没有人写这家店的探店笔记</div>
        <div class="note-empty" v-if="blogLoading">加载中…</div>
        <div class="note-foot" v-if="canLoadMoreBlogs" @click="loadBlogs">查看全部 {{blogTotal}} 篇探店笔记</div>
      </div>
    </div>
    <div class="shop-divider"></div>
    <div class="copyright">
      copyright ©2021 hmdp.com
    </div>
  </template>
</div>
<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<!-- 引入组件库 -->
<script src="./js/element.js"></script>
<script src="./js/common.js"></script>
<script>

  const app = new Vue({
    el: "#app",
    data: {
      util,
      shop: {},
      vouchers: [],
      blogs: [],
      blogTotal: 0,
      blogCurrent: 1,
      blogLoading: false,
      voucherLoading: false,
      loading: true,
      buying: false,
      nowTs: Date.now(),
      timer: null
    },
    computed: {
      canLoadMoreBlogs() {
        return this.blogs.length < this.blogTotal;
      }
    },
    created() {
      const shopId = util.getUrlParam("id");
      if (!shopId) {
        this.loading = false;
        return;
      }
      this.queryShopById(shopId);
      this.queryVoucher(shopId);
      this.queryBlogs(shopId, 1);
    },
    mounted() {
      // 券倒计时每秒刷新；页面隐藏时暂停，回来时立刻校准
      this.timer = setInterval(() => {
        if (!document.hidden) {
          this.nowTs = Date.now();
        }
      }, 1000);
      document.addEventListener("visibilitychange", this.syncNow);
    },
    beforeDestroy() {
      clearInterval(this.timer);
      document.removeEventListener("visibilitychange", this.syncNow);
    },
    methods: {
      goBack() {
        history.back();
      },
      syncNow() {
        this.nowTs = Date.now();
      },
      queryShopById(shopId) {
        axios.get("/shop/" + shopId)
          .then(({data}) => {
            data.images = data.images ? data.images.split(",") : [];
            this.shop = data;
          })
          .catch(err => {
            this.shop = {};
            this.$message.error(err);
          })
          .finally(() => this.loading = false)
      },
      queryVoucher(shopId) {
        this.voucherLoading = true;
        axios.get("/voucher/list/" + shopId)
          .then(({data}) => {
            this.vouchers = data || [];
          })
          .catch(err => this.$message.error(err))
          .finally(() => this.voucherLoading = false)
      },
      queryBlogs(shopId, current) {
        if (this.blogLoading) {
          return;
        }
        this.blogLoading = true;
        axios.get("/blog/of/shop/" + shopId, {params: {current}})
          .then(({data, total}) => {
            const rows = data || [];
            this.blogTotal = total || rows.length;
            this.blogs = current === 1 ? rows : this.blogs.concat(rows);
            this.blogCurrent = current;
          })
          .catch(err => this.$message.error(err))
          .finally(() => this.blogLoading = false)
      },
      loadBlogs() {
        const shopId = util.getUrlParam("id");
        this.queryBlogs(shopId, this.blogCurrent + 1);
      },
      toBlog(id) {
        location.href = "/blog-detail.html?id=" + id;
      },
      blogCover(b) {
        return util.firstImage(b.images) || "/imgs/icons/default-icon.png";
      },
      onImgError(e) {
        util.imgFallback(e);
      },

      /* ------- 券状态机：notBegin / ongoing / ended ------- */
      beginTs(v) {
        const d = util.toDate(v.beginTime);
        return d ? d.getTime() : 0;
      },
      endTs(v) {
        const d = util.toDate(v.endTime);
        return d ? d.getTime() : 0;
      },
      voucherState(v) {
        if (!v.type) {
          return "ongoing";
        }
        const begin = this.beginTs(v);
        const end = this.endTs(v);
        if (begin && this.nowTs < begin) {
          return "notBegin";
        }
        if (end && this.nowTs > end) {
          return "ended";
        }
        return "ongoing";
      },
      voucherBtnText(v) {
        if (!v.type) {
          return "抢购";
        }
        const state = this.voucherState(v);
        if (state === "notBegin") {
          return "未开始";
        }
        if (state === "ended") {
          return "已结束";
        }
        if (v.stock < 1) {
          return "已抢光";
        }
        return this.buying ? "处理中" : "限时抢购";
      },
      voucherTip(v) {
        if (!v.type) {
          return "";
        }
        const state = this.voucherState(v);
        const end = this.endTs(v);
        const begin = this.beginTs(v);
        if (state === "notBegin" && begin) {
          return "距开始 " + util.formatCountdown(begin - this.nowTs);
        }
        if (state === "ended") {
          return "活动已结束";
        }
        if (end) {
          return "距结束 " + util.formatCountdown(end - this.nowTs);
        }
        return "";
      },

      seckill(v) {
        if (this.buying) {
          return;
        }
        if (!util.isLogin()) {
          this.$message.error("请先登录");
          sessionStorage.setItem("redirectAfterLogin", location.pathname + location.search);
          setTimeout(() => location.href = "/login.html", 400);
          return;
        }
        const state = this.voucherState(v);
        if (state === "notBegin") {
          this.$message.warning("优惠券抢购尚未开始！");
          return;
        }
        if (state === "ended") {
          this.$message.warning("优惠券抢购已经结束！");
          return;
        }
        if (v.stock < 1) {
          this.$message.warning("库存不足，请刷新再试试！");
          return;
        }
        this.buying = true;
        axios.post("/voucher-order/seckill/" + v.id)
          .then(({data}) => {
            this.$message.success("抢购成功，正在生成订单");
            setTimeout(() => {
              location.href = "/order.html?orderId=" + data;
            }, 600);
          })
          .catch(err => {
            this.$message.error(err);
            // 抢失败多半是库存/资格变化，刷新券列表让用户看到最新余量
            this.queryVoucher(util.getUrlParam("id"));
          })
          .finally(() => this.buying = false)
      }
    }
  })
</script>
<script src="/js/assistant-entry.js"></script>
</body>
</html>
