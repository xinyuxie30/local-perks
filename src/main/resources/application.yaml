server:
  port: 8081
spring:
  application:
    name: local-perks
  servlet:
    multipart:
      # 图片上传大小上限，防止大文件打爆堆内存
      max-file-size: 5MB
      max-request-size: 10MB
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: "${DB_URL:jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC}"
    username: ${DB_USER:root}
    password: "${DB_PASSWORD}"
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: "${REDIS_PASSWORD:}"
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: local-perks-producer
seckill:
  # A：入口执行 Lua 预扣库存并通过事务消息投递下单；B：入口只排队，库存由消费者认领
  mode: ${SECKILL_MODE:A}
trade:
  # RocketMQ 4.x 只有 18 个固定延迟级别：1s 5s 10s 30s 1m 2m 3m 4m 5m 6m 7m 8m 9m 10m 20m 30m 1h 2h
  # 默认 16 表示 30 分钟；本地演示改成 3（10 秒）方便观察关单
  close-delay-level: ${TRADE_CLOSE_DELAY_LEVEL:16}
  # 与上面延迟级别对应的业务口径，供对账补关单使用
  close-delay-minutes: ${TRADE_CLOSE_DELAY_MINUTES:30}
  reconcile-cron: ${TRADE_RECONCILE_CRON:0 2/5 * * * ?}
  # 单次对账最多捞取的超时订单数，避免一次扫太多把内存和 DB 打满
  reconcile-batch-size: ${TRADE_RECONCILE_BATCH:100}
app:
  http:
    # 与 Nginx upstream keepalive 配合；后端空闲超时略长于入口的 60 秒。
    keep-alive-requests: ${HTTP_KEEP_ALIVE_REQUESTS:10000}
    keep-alive-timeout-ms: ${HTTP_KEEP_ALIVE_TIMEOUT_MS:65000}
  admin:
    # 管理端接口白名单，逗号分隔的用户id；默认测试账号 1011
    user-ids: ${ADMIN_USER_IDS:1011}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    # Redis 故障时是否放行：业务接口优先可用性
    fail-open: ${RATE_LIMIT_FAIL_OPEN:true}
  cache:
    # 本地缓存条目上限与过期时间，防止堆内存无界增长
    shop-max-size: ${SHOP_LOCAL_CACHE_MAX:10000}
    shop-ttl-seconds: ${SHOP_LOCAL_CACHE_TTL:300}
logging:
  level:
    com.hmdp: debug
  pattern:
    dateformat: mm:ss.SSS
